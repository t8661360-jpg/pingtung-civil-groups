<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="屏東縣社團（職業團體）會務文件線上填報：籌備會、成立大會、會員大會改選／常年／解散、理監事會等縣府範本，資料連動，可下載 Word、Excel、PDF。">
<title>會務文件線上填報｜屏東縣社團（職業團體）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
</head>
<body>
<header class="bar">
  <button class="icon" id="back" aria-label="回首頁" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="ttl"><b id="hTitle">會務文件線上填報</b><small id="hSub"></small></div>
  <button id="cloudChip" class="cloudchip" hidden></button>
  <span id="saved" class="saved" aria-live="polite"></span>
  <button class="icon" id="fontBtn" aria-label="放大字體" aria-pressed="false" title="放大字體">A＋</button>
  <button class="icon" id="menuBtn" aria-label="更多功能" title="更多功能"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
</header>
<nav id="steps" class="steps" hidden aria-label="步驟"></nav>
<main id="view" class="view"></main>
<div id="dock" class="dock" hidden></div>
<div id="pv" hidden role="dialog" aria-label="文件預覽"></div>
<div id="seal" hidden role="dialog" aria-label="電子印章"></div>
<div id="sheet" hidden></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="sealIn" accept="image/*" multiple hidden>
<input type="file" id="upIn" accept="image/*,application/pdf,.pdf,.doc,.docx,.odt,.xls,.xlsx" multiple hidden>
<div id="busy" hidden><div><div class="spin"></div><span>處理中…</span></div></div>
<div id="modal" hidden role="alertdialog"><div class="box"><p></p><div class="row"><button class="btn ghost no">取消</button><button class="btn ok">確定</button></div></div></div>
<div id="toasts" aria-live="polite"></div>
<script>
/*JS*/
</script>
</body>
</html>
