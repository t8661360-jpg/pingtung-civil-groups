<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人民團體會務表單線上填報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--bg:#eceeea;--panel:#fff;--ink:#1c2628;--mute:#66736f;--line:#d9ddd7;--pri:#1f5f5b;--pri2:#e3efec;--acc:#a8432a;--warn:#b7791f;--ok:#2f7d4f;--r:10px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#1b3836;color:#f2f5f2;border-bottom:3px solid var(--acc)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal{width:34px;height:34px;border:2px solid #e9b3a3;color:#f3c7b9;border-radius:6px;display:grid;place-items:center;font-family:"Noto Serif TC",serif;font-weight:700;font-size:15px;line-height:1;flex:none;letter-spacing:-1px}
.brand h1{font-family:"Noto Serif TC",serif;font-size:17px;margin:0;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.brand small{display:block;font-size:12px;color:#b9cbc6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tools button{background:transparent;color:#dfe8e4;border:1px solid #4d6b67;border-radius:7px;padding:5px 10px;font-size:13px}
.tools button:hover{background:#28504c;color:#fff}
#navToggle,#pvToggle{display:none}
.body{display:grid;grid-template-columns:236px minmax(0,1fr) minmax(0,44%);min-height:0}
nav#nav{background:#f6f7f4;border-right:1px solid var(--line);overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
nav#nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;color:var(--ink)}
nav#nav button:hover{background:#eaeee9}
nav#nav button.on{background:var(--pri);color:#fff}
nav#nav .no{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#e1e6e1;color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
nav#nav button.on .no{background:rgba(255,255,255,.2);color:#fff}
nav#nav .tx{display:flex;flex-direction:column;min-width:0;flex:1}
nav#nav .tx b{font-weight:600;font-size:13.5px;line-height:1.3}
nav#nav .tx small{font-size:11.5px;color:var(--mute);margin-top:1px}
nav#nav button.on small{color:#cfe3df}
nav#nav .warn{background:var(--warn);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center;font-weight:700}
.navfoot{margin-top:auto;padding:12px 8px 4px;font-size:11.5px;color:var(--mute);line-height:1.6}
#formcol{overflow:auto;padding:18px 22px 60px;min-width:0}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phead h2{font-family:"Noto Serif TC",serif;font-size:22px;margin:0;letter-spacing:.03em}
.phead .dlrow{margin-left:auto}
.dlrow{display:flex;gap:8px;flex-wrap:wrap}
.dl{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px 6px 6px;font-size:13px;font-weight:600;color:var(--ink);transition:transform .08s,box-shadow .15s}
.dl:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);transform:translateY(-1px)}
.dl:disabled{opacity:.5;cursor:wait}
.dl .ic{width:22px;height:22px;border-radius:5px;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.dl.w .ic{background:#2b579a}.dl.x .ic{background:#217346}.dl.p .ic{background:#b42318}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;margin-bottom:14px}
.card.hl{border-color:#b9d3cd;background:linear-gradient(180deg,#f4faf8,#fff)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ch h3{margin:0;font-size:15px;font-weight:700;color:var(--pri);display:flex;align-items:center;gap:8px}
.ch h3::before{content:"";width:4px;height:15px;background:var(--acc);border-radius:2px}
.card h4{font-size:13.5px;margin:14px 0 6px;color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);margin:-2px 0 10px;line-height:1.6}
.grid{display:flex;flex-wrap:wrap;gap:10px 14px}
.f{display:flex;flex-direction:column;gap:4px;flex:1 1 200px;min-width:0}
.f.s{flex:0 1 150px}.f.m{flex:1 1 240px}.f.l{flex:2 1 320px}.f.full{flex:1 1 100%}.f.half{flex:1 1 300px}
.f label{font-size:12.5px;color:#46514e;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:600;color:var(--pri);background:var(--pri2);border:1px solid #c5ddd7;border-radius:999px;padding:0 7px;line-height:17px}
.rst{display:none;font-size:11px;border:0;background:none;color:var(--acc);padding:0}
.f.ov .rst{display:inline}
.f.ov .chip{color:#8a6d1f;background:#fbf3dc;border-color:#eddcaa}
.in{display:flex;align-items:center;gap:5px}
.in input,.in select,.in textarea,.lst input,.lst select,.lst textarea,.acc input{width:100%;border:1px solid #cfd5ce;border-radius:7px;padding:7px 9px;background:#fff;min-width:0;transition:border-color .15s,box-shadow .15s}
.in textarea,.lst textarea{resize:vertical;line-height:1.5}
.in input:focus,.in select:focus,.in textarea:focus,.lst input:focus,.lst select:focus,.lst textarea:focus,.acc input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(31,95,91,.14)}
::placeholder{color:#8fa29d;opacity:1}
.f:has(.chip) ::placeholder{color:#3d8a80;font-style:normal}
.suf{color:var(--mute);font-size:13px;white-space:nowrap}
.in.date{gap:3px;flex-wrap:nowrap}
.in.date input{width:52px;padding:7px 5px;text-align:center}
.in.date input.dy{width:56px}
.in.date select{width:72px;padding:7px 4px}
.in.date span{color:var(--mute);font-size:12.5px}
.in.date.sm input{width:38px;padding:6px 2px}.in.date.sm input.dy{width:42px}
.hint{font-size:11.5px;color:var(--mute)}
.out{padding:8px 10px;background:#f5f7f4;border:1px dashed #cfd5ce;border-radius:7px;font-family:"Noto Serif TC",serif;font-size:15px;min-height:38px}
.out-note{font-size:12.5px;color:var(--mute);flex:1 1 100%}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer}
.ck.half{flex:1 1 45%}.ck.full{flex:1 1 100%}
.ck input{width:16px;height:16px;accent-color:var(--pri)}
.cks{display:flex;flex-wrap:wrap;gap:6px 16px}
.lst{width:100%}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.lst table,.acc{width:100%;border-collapse:collapse;font-size:13px}
.lst.wide table{min-width:980px;table-layout:fixed}
#form .lst.wide.roster table{min-width:1240px}
.acc input.nm::placeholder{color:var(--ink)}
.acc td{white-space:nowrap}
.lst th,.acc th{background:#f2f4f0;font-weight:600;text-align:left;padding:7px 6px;font-size:12px;color:#46514e;border-bottom:1px solid var(--line);white-space:nowrap}
.lst td{padding:4px;border-bottom:1px solid #eef0ec;vertical-align:top}
.lst td input,.lst td select,.lst td textarea{padding:6px 7px;border-radius:6px}
.lst td.empty{color:var(--mute);text-align:center;padding:14px;font-size:12.5px}
.lst td.act,.lst th.act{width:86px;white-space:nowrap;text-align:right}
.lst td.act button{border:0;background:#f1f3ef;border-radius:5px;width:24px;height:26px;margin-left:2px;color:#56625f}
.lst td.act button:hover{background:#e3e8e3}
.lst td.act button.del:hover{background:#f7dfd8;color:var(--acc)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.lbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600}
.btn.ghost{background:#fff;color:var(--pri);border-color:#b9d3cd}
.btn:hover{filter:brightness(1.08)}
.stat{margin-top:8px;font-size:13px;color:#46514e}
.calc b{color:var(--pri)}
.prop{border:1px solid #e3e7e1;border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fbfcfa}
.prop.off{opacity:.65}
.prop .ph{margin-bottom:6px}
.elres{background:#f5f8f6;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.8}
.muted{color:var(--mute)}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;background:#e2e6e0;padding:4px;border-radius:9px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;color:#46514e}
.tabs button.on{background:#fff;color:var(--pri);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.acc td{padding:3px 5px;border-bottom:1px solid #eef0ec}
.acc td input{padding:5px 7px;border-radius:5px}
.acc tr.lv0 td{background:#eef4f2;font-weight:700}
.acc tr.lv1 td{background:#fafbf9}
.acc input.nm.lv1{padding-left:18px}.acc input.nm.lv2{padding-left:32px}
.acc input.nm.lv0{font-weight:700}
.acc td.sum{text-align:right;font-variant-numeric:tabular-nums;padding-right:10px;font-weight:600;color:var(--pri)}
.acc tr.sur td{border-top:2px solid var(--pri);padding:8px 5px}
.acc tr.g td{background:#f2f6f4;font-weight:700}
.acc tr.t td{background:#e3efec;font-weight:700}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--acc);font-weight:600}
table.map{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.map th,table.map td{border-bottom:1px solid #eceee9;padding:6px 8px;text-align:left;vertical-align:top}
table.map th{background:#f2f4f0;font-size:12px}
table.map td:first-child{white-space:nowrap;font-weight:600;color:var(--pri)}
.flow p{margin:0 0 6px;font-size:13px;line-height:1.7}
.checks{margin-top:14px;border-radius:8px;background:#fffaf0;border:1px solid #f0dfb8;padding:10px 12px;font-size:13px;line-height:1.8}
.checks.okb{background:#f1f8f3;border-color:#cfe6d6;color:var(--ok)}
.checks .warn{color:#8a4b14}.checks .info{color:#55605d}
.checks a{color:var(--pri);font-weight:600}
#prevcol{background:#d9ddd6;overflow:auto;border-left:1px solid var(--line);position:relative}
.pvbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(217,221,214,.92);backdrop-filter:blur(4px);font-size:12.5px;color:#46514e;border-bottom:1px solid #c9cec6}
.pvbar b{color:var(--ink)}
.pvbar .live{width:8px;height:8px;border-radius:50%;background:#2f9e6b;box-shadow:0 0 0 3px rgba(47,158,107,.2)}
#preview{padding:16px 0 40px;transform-origin:top center}
#preview .sheet{margin:0 auto 18px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.sheet{width:210mm;min-height:297mm;padding:18mm 17mm;background:#fff;color:#000;font-family:"DFKai-SB","BiauKai","標楷體","Noto Serif TC",serif}
.sheet p{margin:0;white-space:pre-wrap;word-break:break-word}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet td{border:.75pt solid #000;vertical-align:middle;line-height:1.3;white-space:pre-wrap;word-break:break-all}
.sheet td.h{background:#f2f2f2}
.pdf-stage{position:fixed;left:0;top:0;z-index:-1;width:182mm;background:#fff}
.pdf-stage .sheet{width:182mm;min-height:0;padding:0;box-shadow:none;margin:0}
#busy{position:fixed;inset:0;background:rgba(236,238,234,.94);display:grid;place-items:center;z-index:50}
#busy[hidden]{display:none}
#busy div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 26px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);font-weight:600}
.spin{width:22px;height:22px;border:3px solid var(--pri2);border-top-color:var(--pri);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#modal{position:fixed;inset:0;background:rgba(20,30,28,.45);display:grid;place-items:center;z-index:60}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:12px;padding:20px 22px;max-width:420px;width:calc(100% - 40px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
#modal p{margin:0 0 16px;line-height:1.7}
#modal .row{display:flex;gap:8px;justify-content:flex-end}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;align-items:center}
.toast{background:#1b3836;color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:opacity .4s,transform .4s;max-width:88vw}
.toast.err{background:var(--acc)}
.toast.out{opacity:0;transform:translateY(8px)}
@media (max-width:1180px){.body{grid-template-columns:210px minmax(0,1fr)}#prevcol{display:none}body.pvopen #prevcol{display:block;position:fixed;inset:58px 0 0 auto;width:min(860px,100%);z-index:30;box-shadow:-8px 0 30px rgba(0,0,0,.2)}#pvToggle{display:inline-block}}
@media (max-width:760px){.brand h1{font-size:14.5px}.seal{display:none}.tools button{padding:4px 8px;font-size:12px}.body{grid-template-columns:1fr}nav#nav{display:none}body.navopen nav#nav{display:flex;position:fixed;inset:58px auto 0 0;width:260px;z-index:31;box-shadow:8px 0 30px rgba(0,0,0,.2)}#navToggle{display:inline-block}#formcol{padding:14px 12px 60px}.brand small{display:none}.tools .opt{display:none}.bs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="navToggle" style="border:1px solid #4d6b67;background:none;color:#fff;border-radius:7px;padding:5px 9px">☰</button>
    <div class="brand"><div class="seal">會務</div><div><h1>人民團體會務表單線上填報</h1><small id="orgName"></small></div></div>
    <div class="tools">
      <span id="saved" class="opt" style="font-size:12px;color:#9fb6b0;align-self:center;margin-right:6px"></span>
      <button data-cmd="sample" class="opt">載入範例</button>
      <button data-cmd="backup">備份資料</button>
      <button data-cmd="restore">還原資料</button>
      <button data-cmd="clear" class="opt">清除</button>
      <button id="pvToggle">預覽</button>
    </div>
  </header>
  <div class="body">
    <nav id="nav"></nav>
    <main id="formcol">
      <div class="phead"><h2 id="ptitle"></h2><div class="dlrow" id="pdl"></div></div>
      <div id="form"></div>
    </main>
    <aside id="prevcol">
      <div class="pvbar"><span class="live"></span><b>即時預覽</b><span id="pvinfo"></span><span style="margin-left:auto">下載的 Word／Excel／PDF 內容與此相同</span></div>
      <div id="preview"></div>
    </aside>
  </div>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="busy" hidden><div><div class="spin"></div><span>處理中…</span></div></div>
<div id="modal" hidden><div class="box"><p></p><div class="row"><button class="btn ghost no">取消</button><button class="btn ok">確定</button></div></div></div>
<div id="toasts"></div>
<script>
/* ===== 工具 ===== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[,，\s]/g, '')); return isFinite(n) ? n : 0; };
const hasNum = v => String(v ?? '').trim() !== '' && isFinite(parseFloat(String(v).replace(/[,，\s]/g, '')));
const fmt = n => { n = Math.round(n || 0); return (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('en-US'); };
const CNN = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function cn(n) {
  n = parseInt(n, 10); if (!n || n < 0) return '';
  if (n <= 10) return CNN[n];
  if (n < 20) return '十' + (n % 10 ? CNN[n % 10] : '');
  if (n < 100) return CNN[Math.floor(n / 10)] + '十' + (n % 10 ? CNN[n % 10] : '');
  return String(n);
}
const FW = '　';
const O = (v, ph = '○○○') => (v === '' || v == null) ? ph : String(v);
const BL = (v, n = 2) => (v === '' || v == null) ? FW.repeat(n) : String(v);
const isBlank = v => v == null || (typeof v === 'string' && v.trim() === '');
function rd(d, n = 2) { d = d || {}; return `${BL(d.y, n)}年${BL(d.m, 1)}月${BL(d.d, 1)}日`; }
function rdOrBlank(d) { d = d || {}; return (!d.y && !d.m && !d.d) ? '' : rd(d); }
function rt(t) { t = t || {}; return `${t.ap || FW}午${BL(t.h, 1)}時${BL(t.mi, 1)}分`; }
function dateEmpty(d) { return !d || (isBlank(d.y) && isBlank(d.m) && isBlank(d.d)); }
function rocAddYearsMinusDay(d, years) {
  if (!d || !hasNum(d.y) || !hasNum(d.m) || !hasNum(d.d)) return null;
  const dt = new Date(num(d.y) + 1911 + num(years), num(d.m) - 1, num(d.d));
  dt.setDate(dt.getDate() - 1);
  return { y: String(dt.getFullYear() - 1911), m: String(dt.getMonth() + 1), d: String(dt.getDate()) };
}
function todayRoc() { const t = new Date(); return { y: String(t.getFullYear() - 1911), m: String(t.getMonth() + 1), d: String(t.getDate()) }; }

function getp(o, path) { return path.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o); }
function setp(o, path, v) {
  const ks = path.split('.'); let a = o;
  for (let i = 0; i < ks.length - 1; i++) {
    if (a[ks[i]] == null || typeof a[ks[i]] !== 'object') a[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {};
    a = a[ks[i]];
  }
  a[ks[ks.length - 1]] = v;
}
function isEmptyVal(v) {
  if (v == null) return true;
  if (typeof v === 'string') return v.trim() === '';
  if (typeof v === 'object' && !Array.isArray(v)) {
    if ('y' in v || 'm' in v || 'd' in v) return dateEmpty(v);
    return Object.keys(v).length === 0;
  }
  return false;
}

/* ===== 狀態 ===== */
const LS_KEY = 'rt-forms-v1';
const ROLES = ['理事長', '常務理事', '理事', '候補理事', '常務監事', '監事', '候補監事', '總幹事', '會計', '出納', '會務人員'];
const DIR_ROLES = ['理事長', '常務理事', '理事'];
const SUP_ROLES = ['常務監事', '監事'];

function blankState() {
  return {
    basic: { county: '屏東縣', town: '', org: '', term: '', year: '', budgetYear: '', termYears: '4',
      regDate: {}, regWord: '', regNum: '', courtDate: {}, courtNo: '', reelectDate: {},
      membersGroup: '', membersPerson: '', address: '', phone: '', fax: '', web: '', email: '', fillDate: {} },
    roster: [],
    assembly: { term: '', no: '', date: {}, time: {}, place: '', should: '', attend: '', leave: '', absent: '', obs: '',
      chair: '', rec: '', speech: '', report: '', refTerm: '', refNo: '',
      fin: { on: true }, plan: { on: true }, bud: { on: true }, props: [], motions: [],
      hasEl: true, el: { jp: '', fp: '', cp: '', jip: '', dirSeats: '', dirAlt: '', supSeats: '', supAlt: '', dirs: [], sups: [] },
      end: {} },
    board: { term: '', no: '', date: {}, time: {}, place: '', dirs: '', sups: '', obs: '', chair: '', rec: '',
      electTerm: '', stdDir: '', stdSup: '', stdSupVotes: '', chairman: '', chairVotes: '',
      addr: { on: true }, staff: { on: true }, props: [], motion: '', end: {} },
    cert: { name: '', birthplace: '', birth: {}, addr: '', phone: '', org: '', term: '', firstDate: {}, tenure: '', note: '' },
    consent: { loc: '', landNo: '', ping: '', sqm: '', from: {}, to: {}, lender: '', witness: '', chairman: '', date: {} },

const stripCat = s => String(s || '').replace(/^[一二三四五六七八九十]+、/, '').trim();
const stripItem = s => String(s || '').replace(/^[（(][一二三四五六七八九十]+[）)]/, '').trim();

  const span = (key, i) => { if (i > 0 && lab[i - 1][key] === lab[i][key]) return 0; let n = 1; while (i + n < lab.length && lab[i + n][key] === lab[i][key]) n++; return n; };

function finHeader(title, period) {

const finSign = () => P(sigLine([['製表：', ''], ['會計：', pname('會計')], ['總幹事：', pname('總幹事')], ['理事長：', pname('理事長')]]), { before: 8, size: 11 });
function accRows(cols, extra) {
  // cols: [{c:'b'}...] 三個金額欄 + 說明欄 key
  const hide = S.fin.hideZero; const rows = [];
  const showAcc = a => a.lvl === 0 || !hide || !accZero(a);
  const walk = (list) => list.forEach(a => {
    if (!showAcc(a)) return;
    const name = (a.lvl === 0 ? '' : FW.repeat(a.lvl === 1 ? 1 : 2)) + accName(a);
    const kidsShown = a.kids ? a.kids.filter(showAcc) : [];
    const sumF = col => kidsShown.length ? kidsShown.map(k => `{${col}:${k.k}}`).join('+') : '';
    const cells = [
      { v: a.lvl === 0 ? String(a.idx) : '', al: 'c' }, { v: a.lvl === 1 ? String(a.idx) : '', al: 'c' }, { v: a.lvl === 2 ? String(a.idx) : '', al: 'c' },
      { v: name, b: a.lvl === 0 },
      NUMC(accVal(a, cols[0]), { b: a.lvl === 0, f: a.kids ? sumF('E') : '' }),
      NUMC(accVal(a, cols[1]), { b: a.lvl === 0, f: a.kids ? sumF('F') : '' }),
      NUMC(accVal(a, cols[0]) - accVal(a, cols[1]), { b: a.lvl === 0, f: '{E:@}-{F:@}' }),
      { v: (S.fin.v[a.k] || {})[cols[2]] || '', sz: 9 },
    ];
    rows.push({ key: a.k, cells });
    if (a.kids) walk(a.kids);
  });
  walk(ACC);
  const surB = finSurplus(cols[0]), surP = finSurplus(cols[1]);
  rows.push({ key: 'sur', cells: [{ v: '3', al: 'c' }, { v: '' }, { v: '' }, { v: '本期餘絀', b: true }, NUMC(surB, { b: true, f: '{E:inc}-{E:exp}' }), NUMC(surP, { b: true, f: '{F:inc}-{F:exp}' }), NUMC(surB - surP, { b: true, f: '{E:@}-{F:@}' }), { v: '' }] });
  if (extra) extra(rows);
  return rows;
}

/* ===== 表格排版（處理跨欄跨列） ===== */
function layoutTable(rows) {
  const occ = []; const out = [];
  rows.forEach((row, ri) => {
    occ[ri] = occ[ri] || [];
    const cont = occ[ri].some(Boolean); // 有上列跨列延伸進來
    let c = 0; const pl = [];
    for (const cell of row.cells) {
      while (occ[ri][c]) c++;
      const cs = cell.cs || 1, rs = cell.rs || 1;
      for (let i = 0; i < rs; i++) { occ[ri + i] = occ[ri + i] || []; for (let j = 0; j < cs; j++) occ[ri + i][c + j] = 1; }
      pl.push({ cell, col: c, cs, rs }); c += cs;
    }
    out.push({ row, pl, cont });
  });
  return out;
}
const cellText = c => (c.n && typeof c.v === 'number') ? fmt(c.v) : (c.v == null ? '' : String(c.v));
const ALC = { c: 'center', r: 'right', j: 'justify', l: 'left' };

/* ===== HTML（預覽與 PDF） ===== */
function sheetHTML(sh) {
  const tot = sh.cols.reduce((a, b) => a + b, 0);
  let h = `<div class="sheet" style="font-size:${sh.size || 12}pt;line-height:${sh.ls || 1.4}">`;
  for (const b of sh.blocks) {
    if (b.t === 'p') {
      const st = [`text-align:${ALC[b.align] || 'left'}`];
      if (b.size) st.push(`font-size:${b.size}pt`);
      if (b.bold) st.push('font-weight:700');
      const ind = (b.indent || 0) + (b.hang || 0); if (ind) st.push(`padding-left:${ind}em`);
      if (b.hang) st.push(`text-indent:-${b.hang}em`);
      if (b.firstIndent) st.push(`text-indent:${b.firstIndent}em`);
      if (b.sp) st.push(`letter-spacing:${b.sp}em`);
      st.push(`margin:${b.before || 0}pt 0 ${b.after ?? 2}pt`);
      h += `<p style="${st.join(';')}">${esc(b.text) || '&nbsp;'}</p>`;
    } else if (b.t === 'table') {
      const pad = b.pad != null ? b.pad : 2;
      h += `<table style="font-size:${b.size || sh.size}pt"><colgroup>${sh.cols.map(w => `<col style="width:${(w / tot * 100).toFixed(3)}%">`).join('')}</colgroup>`;
      for (const L of layoutTable(b.rows)) {
        h += `<tr${L.cont ? ' data-nb="1"' : ''}>`;
        for (const p of L.pl) {
          const c = p.cell, st = [`text-align:${ALC[c.al] || 'left'}`, `padding:${pad}pt 3pt`];
          if (c.b) st.push('font-weight:700'); if (c.sz) st.push(`font-size:${c.sz}pt`); if (c.va === 't') st.push('vertical-align:top');
          h += `<td${p.cs > 1 ? ` colspan="${p.cs}"` : ''}${p.rs > 1 ? ` rowspan="${p.rs}"` : ''}${c.h ? ' class="h"' : ''} style="${st.join(';')}">${esc(cellText(c))}</td>`;
        }
        h += '</tr>';
      }
      h += '</table>';
    }
  }
  return h + '</div>';
}

function loadLib(k) {
  if (LIBS[k][1]()) return Promise.resolve(LIBS[k][1]());

    const s = document.createElement('script'); s.src = LIBS[k][0]; s.async = true;

}

    for (const b of sh.blocks) {
      if (b.t === 'p') {
        const sz = b.size || sh.size || 12, em = sz * 20;
        const ind = {};
        if (b.indent || b.hang) { ind.left = Math.round(((b.indent || 0) + (b.hang || 0)) * em); if (b.hang) ind.hanging = Math.round(b.hang * em); }
        if (b.firstIndent) ind.firstLine = Math.round(b.firstIndent * em);
        children.push(new Paragraph({ children: runs(b.text, sz, b.bold, b.sp), alignment: AL[b.align] || AlignmentType.LEFT, indent: ind,
          spacing: { before: Math.round((b.before || 0) * 20), after: Math.round((b.after ?? 2) * 20), line: Math.round(240 * (sh.ls || 1.3)), lineRule: LineRuleType.AUTO } }));
      } else if (b.t === 'table') {
        const tsz = b.size || sh.size || 12, pad = b.pad != null ? b.pad : 2;
        const rows = layoutTable(b.rows).map(L => new TableRow({ cantSplit: true, tableHeader: !!L.row.hdr, children: L.pl.map(p => {
          const c = p.cell, sz = c.sz || tsz;
          const paras = cellText(c).split('\n').map(line => new Paragraph({ children: runs(line, sz, c.b), alignment: AL[c.al] || AlignmentType.LEFT, spacing: { before: 0, after: 0, line: 252, lineRule: LineRuleType.AUTO } }));
          return new TableCell({ children: paras, columnSpan: p.cs > 1 ? p.cs : undefined, rowSpan: p.rs > 1 ? p.rs : undefined,
            width: { size: colTw.slice(p.col, p.col + p.cs).reduce((a, b) => a + b, 0), type: WidthType.DXA },
            verticalAlign: c.va === 't' ? VerticalAlign.TOP : VerticalAlign.CENTER, borders,
            margins: { top: Math.round(pad * 20), bottom: Math.round(pad * 20), left: 70, right: 70 },
            shading: c.h ? { fill: 'F2F2F2', type: ShadingType.CLEAR, color: 'auto' } : undefined });
        }) }));
        children.push(new Table({ rows, width: { size: CW, type: WidthType.DXA }, columnWidths: colTw, layout: TableLayoutType.FIXED }));
      }
    }
    return { properties: { page: { size: { width: PAGE_W, height: PAGE_H }, margin: { top: MY, bottom: MY, left: MX, right: MX } } }, children };
  });
  const d = new Document({ creator: '人民團體會務線上填報', title: doc.title, styles: { default: { document: { run: { font: FONT, size: 24 } } } }, sections });
  return Packer.toBlob(d);
}

/* ===== Excel (.xlsx) ===== */
function textUnits(s, size) { let u = 0; for (const ch of String(s)) u += ch.charCodeAt(0) < 256 ? 1.1 : 2.05; return u * size / 11; }
function estLines(text, width, size) { return String(text ?? '').split('\n').reduce((n, line) => n + Math.max(1, Math.ceil(textUnits(line, size) / Math.max(4, width - 1.5))), 0); }
async function toXlsx(doc) {
  const ExcelJS = await loadLib('exceljs');
  const wb = new ExcelJS.Workbook(); wb.creator = '人民團體會務線上填報'; wb.created = new Date();
  const used = new Set();
  const thin = { style: 'thin', color: { argb: 'FF000000' } };
  const BORDER = { top: thin, left: thin, bottom: thin, right: thin };
  const AH = { c: 'center', r: 'right', j: 'justify', l: 'left' };
  for (const sh of doc.sheets) {
    let name = sh.name.replace(/[\[\]:*?\/\\]/g, '').slice(0, 31), k = 2;
    while (used.has(name)) name = sh.name.slice(0, 28) + '_' + (k++); used.add(name);
    const ws = wb.addWorksheet(name, { views: [{ showGridLines: false }], pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true, margins: { left: 0.5, right: 0.5, top: 0.6, bottom: 0.6, header: 0.3, footer: 0.3 } } });
    const nc = sh.cols.length, tot = sh.cols.reduce((a, b) => a + b, 0), TW = nc === 1 ? 92 : 104;
    const colW = sh.cols.map(w => w / tot * TW);
    ws.columns = colW.map(w => ({ width: w }));
    const font = (sz, b) => ({ name: '標楷體', size: sz, bold: !!b });
    let r = 1; const keyRow = {}; const fm = [];
    for (const b of sh.blocks) {
      if (b.t === 'p') {
        const sz = b.size || sh.size || 12;
        if (nc > 1) ws.mergeCells(r, 1, r, nc);
        const cell = ws.getCell(r, 1);
        const pre = FW.repeat(Math.round(b.indent || 0) + Math.round(b.firstIndent || 0));
        cell.value = pre + (b.sp ? String(b.text).split('').join(' ') : b.text);
        cell.font = font(sz, b.bold);
        cell.alignment = { horizontal: AH[b.align] || 'left', vertical: 'middle', wrapText: true };
        const lines = estLines(cell.value, TW, sz);
        ws.getRow(r).height = Math.max(sz * 1.5, lines * sz * 1.4 + 2) + Math.min(14, (b.before || 0) * 0.5 + (b.after || 0) * 0.5);
        r++;
      } else if (b.t === 'table') {
        const tsz = b.size || sh.size || 12, pad = b.pad != null ? b.pad : 2;
        const lay = layoutTable(b.rows);
        lay.forEach((L, ri) => { if (L.row.key) keyRow[L.row.key] = r + ri; });
        lay.forEach((L, ri) => {
          const R = r + ri; let maxH = 0;
          for (const p of L.pl) {
            const c = p.cell, sz = c.sz || tsz, C = p.col + 1;
            if (p.cs > 1 || p.rs > 1) ws.mergeCells(R, C, R + p.rs - 1, C + p.cs - 1);
            const x = ws.getCell(R, C);
            const isNum = c.n && typeof c.v === 'number';
            if (c.f) fm.push({ x, f: c.f, R, v: isNum ? c.v : 0 });
            else x.value = isNum ? c.v : cellText(c);
            if (c.n) x.numFmt = '#,##0;-#,##0;0';
            x.font = font(sz, c.b);
            x.alignment = { horizontal: AH[c.al] || (c.n ? 'right' : 'left'), vertical: c.va === 't' ? 'top' : 'middle', wrapText: true };
            if (c.h) x.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F2' } };
            for (let i = 0; i < p.rs; i++) for (let j = 0; j < p.cs; j++) ws.getCell(R + i, C + j).border = BORDER;
            const w = colW.slice(p.col, p.col + p.cs).reduce((a, b) => a + b, 0);
            const hh = (estLines(cellText(c), w, sz) * sz * 1.45 + 5 + pad * 2) / p.rs;
            if (hh > maxH) maxH = hh;
          }
          ws.getRow(R).height = Math.max(tsz * 1.7 + pad * 2, maxH);
        });
        r += lay.length;
      }
    }
    for (const it of fm) {
      let ok = true;
      const formula = it.f.replace(/\{([A-Z]+):([\w@]+)\}/g, (m, col, key) => { const rr = key === '@' ? it.R : keyRow[key]; if (!rr) ok = false; return col + rr; });
      it.x.value = ok ? { formula, result: it.v } : it.v;
    }
  }
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ===== PDF ===== */
async function toPdf(doc, onProgress) {
  const [h2c, jsp] = await Promise.all([loadLib('h2c'), loadLib('jspdf')]);
  const MM = 96 / 25.4, MARG = 14, CWmm = 210 - 2 * MARG, CHmm = 297 - 2 * MARG;
  const stage = document.createElement('div'); stage.className = 'pdf-stage';
  document.body.appendChild(stage);
  const pdf = new jsp.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
  let first = true;
  try {
    for (let si = 0; si < doc.sheets.length; si++) {
      onProgress && onProgress(si + 1, doc.sheets.length);
      stage.innerHTML = sheetHTML(doc.sheets[si]);
      const el = stage.firstElementChild;
      try { await document.fonts.ready; } catch (e) { }
      await new Promise(r => setTimeout(r, 30));
      const W = el.offsetWidth, H = el.offsetHeight, pageH = CHmm * MM * (W / (CWmm * MM));
      const top0 = el.getBoundingClientRect().top;
      const bps = [...el.querySelectorAll('p, tr')].filter(x => !(x.tagName === 'TR' && x.dataset.nb)).map(x => x.getBoundingClientRect().top - top0).filter(y => y > 0);
      const slices = []; let a = 0;
      while (H - a > pageH + 1) {
        let b = 0; for (const y of bps) if (y > a + 20 && y <= a + pageH) b = Math.max(b, y);
        if (!b) b = a + pageH;
        slices.push([a, b]); a = b;
      }
      slices.push([a, H]);
      const canvas = await h2c(el, { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true, windowWidth: document.documentElement.clientWidth });
      const k = canvas.width / W;
      for (const [s, e] of slices) {
        const c = document.createElement('canvas'); c.width = canvas.width; c.height = Math.max(1, Math.round((e - s) * k));
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(canvas, 0, Math.round(s * k), canvas.width, c.height, 0, 0, c.width, c.height);
        if (!first) pdf.addPage(); first = false;
        pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', MARG, MARG, CWmm, (e - s) * CWmm / W);
      }
    }
  } finally { stage.remove(); }
  return pdf.output('blob');
}

/* ===== 儲存檔案 ===== */
let DLP = null;
function dlNS() {
  if (!DLP) DLP = (async () => { try { if (window.claude && window.claude.use) return await window.claude.use('downloads'); } catch (e) { } return null; })();
  return DLP;
}
async function saveFile(filename, blob) {
  if (window.claude && window.claude.use) {
    const dl = await dlNS();
    if (!dl) { toast('目前的檢視無法下載檔案，請在 claude.ai 開啟此頁面後再試。', 'err'); return false; }
    try { await dl.save({ filename, data: blob }); toast('已下載：' + filename); return true; }
    catch (e) {
      if (e && e.code === 'declined') toast('已取消下載');
      else if (e && e.code === 'rate_limited') toast('已有下載確認視窗開啟中，請稍候再試', 'err');
      else toast('下載失敗：' + ((e && (e.message || e.code)) || e), 'err');
      return false;
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast('已下載：' + filename); return true;
}
async function exportDoc(doc, fmtType, baseName) {
  const file = `${baseName}.${fmtType}`;
  const busy = showBusy(`正在產生 ${fmtType === 'docx' ? 'Word' : fmtType === 'xlsx' ? 'Excel' : 'PDF'} 檔…`);
  try {
    let blob;
    if (fmtType === 'docx') blob = await toDocx(doc);
    else if (fmtType === 'xlsx') blob = await toXlsx(doc);
    else blob = await toPdf(doc, (i, n) => busy.set(`正在產生 PDF（第 ${i}/${n} 張表）…`));
    busy.done();
    return await saveFile(file, blob);
  } catch (e) { busy.done(); console.error(e); toast('產生檔案失敗：' + (e.message || e), 'err'); return false; }
}

function FC(p, label, o = {}) { const v = getp(S, p); return `<label class="ck ${o.w || ''}"><input type="checkbox" data-p="${p}"${v !== false ? ' checked' : ''}${o.rr ? ' data-rr="1"' : ''}> ${label}</label>`; }

    const s = ROLES.filter(r => c[r]).map(r => `${r} ${c[r]}`).join('・');
    return s ? `共 ${S.roster.length} 人：${s}` : '尚未輸入人員';
  },
  elResult: () => {
    const E = S.assembly.el;
    const dr = elResult(E.dirs, V('assembly.el.dirSeats'), V('assembly.el.dirAlt')), sr = elResult(E.sups, V('assembly.el.supSeats'), V('assembly.el.supAlt'));
    if (!dr.all.length && !sr.all.length) return '<span class="muted">輸入候選人與得票數後，這裡會依票數自動排出當選人與候補順序。</span>';
    const f = (t, l) => `<div><b>${t}</b>${l.length ? l.map(c => `${esc(c.name)}（${c.v}）`).join('、') : '—'}</div>`;
    return f('當選理事：', dr.win) + f('候補理事：', dr.alt) + f('當選監事：', sr.win) + f('候補監事：', sr.alt);
  },
  planTotal: () => `經費預估合計：<b>${fmt(S.plan.rows.reduce((s, r) => s + num(r.cost), 0))}</b> 元　｜　預算表支出總計：${fmt(accVal(ACC_BY.exp, 'b'))} 元`,
  yrBY: () => esc(O(BY(), '○')), yrY: () => esc(O(Y(), '○')),
  propTotal: () => `財產合計：<b>${fmt(propSum(''))}</b> 元` + PROP_CATS.filter(c => propSum(c)).map(c => `　${c} ${fmt(propSum(c))}`).join(''),
  bsA: () => fmt(bsAssets()), bsL: () => fmt(bsLiab()), bsE: () => fmt(bsEquity()),
  bsCheck: () => { const a = bsAssets(), r = bsLiab() + bsEquity(); return a === r ? `<span class="ok">✓ 兩方合計相同：${fmt(a)} 元</span>` : `<span class="bad">⚠ 兩方合計不同：資產 ${fmt(a)}，負債基金暨餘絀 ${fmt(r)}（差 ${fmt(a - r)}）</span>`; },
  fundTotal: () => `收入合計 <b>${fmt(fundIn())}</b> 元　支出合計 ${fmt(fundOut())} 元　結餘 <b>${fmt(fundIn() - fundOut())}</b> 元`,
  finChecks: () => {
    const b = finSurplus('b');
    return `<div class="${b === 0 ? 'ok' : 'bad'}">${b === 0 ? '✓ 預算收支平衡（本期餘絀為 0）' : `⚠ 預算本期餘絀為 ${fmt(b)}，預算應本收支平衡原則編列，餘絀需歸零。`}</div>
      <div>決算：收入 ${fmt(accVal(ACC_BY.inc, 'a'))}・支出 ${fmt(accVal(ACC_BY.exp, 'a'))}・本期餘絀 <b>${fmt(finSurplus('a'))}</b>・累計餘絀 <b>${fmt(finSurplus('a') + num(S.fin.prev))}</b>・現金本期結存 ${fmt(cashEnd())}</div>`;
  },
};
function calcVal(key) {
  if (CALC[key]) return CALC[key]();
  const [t, a, b] = key.split(':');
  if (t === 'acc') return fmt(accVal(ACC_BY[a], b));
  if (t === 'sur') return fmt(finSurplus(a));
  if (t === 'bsg') return fmt(bsGroupSum([...BS_LEFT, ...BS_RIGHT_L, ...BS_RIGHT_E].find(g => g.k === a)));
  return '';
}

/* ===== 介面 ===== */
function dlButtons(id) {
  return [['docx', 'Word', 'w'], ['xlsx', 'Excel', 'x'], ['pdf', 'PDF', 'p']].map(([f, l, c]) => `<button type="button" class="dl ${c}" data-dl="${f}" data-doc="${id}"><span class="ic">${l[0]}</span>下載 ${l}</button>`).join('');
}
function docFor(id) {
  if (id === 'all') return { title: '全部表單', sheets: ['letter', 'assembly', 'board', 'roster', 'cert', 'consent', 'statute', 'plan'].flatMap(k => DOCS[k]().sheets).concat(docFinance(true).sheets) };
  if (id === 'basic') return { title: '基本資料', sheets: [...DOCS.letter().sheets, ...DOCS.roster().sheets] };
  return DOCS[id]();
}
function renderNav() {
  const issues = checks();
  $('#nav').innerHTML = PAGES.map((p, i) => {
    const n = issues.filter(c => c.page === p.id && c.lv === 'warn').length;
    return `<button type="button" data-page="${p.id}" class="${S.ui.page === p.id ? 'on' : ''}"><span class="no">${i === 0 ? '●' : i}</span><span class="tx"><b>${p.t}</b>${p.s ? `<small>${p.s}</small>` : ''}</span>${n ? `<span class="warn" title="有 ${n} 項需要確認">!</span>` : ''}</button>`;
  }).join('') + `<div class="navfoot">🔒 填寫的資料只存在您自己的瀏覽器，不會上傳到任何伺服器。換電腦或交接請用「備份資料」。<br>本工具為協助填報之輔助網頁，非政府機關官方網站；送件格式以主管機關規定為準。</div>`;
  $('#orgName').textContent = S.basic.org ? orgFull() : '尚未填寫團體名稱';
}
function renderPage() {
  const id = S.ui.page, pg = PAGES.find(p => p.id === id) || PAGES[0];
  $('#ptitle').textContent = pg.t;
  $('#pdl').innerHTML = id === 'basic' ? '' : dlButtons(id);
  $('#form').innerHTML = UI[pg.id]();
  refreshLinked(); refreshCalc(); renderChecks();
  renderNav(); renderPreview();
  $('#formcol').scrollTop = 0;
}
function refreshLinked() {
  $$('#form [data-p]').forEach(el => {
    const p = el.dataset.p, part = el.dataset.part;
    if (el.type === 'checkbox' || el.tagName === 'SELECT') return;
    if (!D[p] && el.dataset.ph == null) return;
    let ph = el.dataset.ph || '';
    if (D[p]) { let d = ''; try { d = D[p](); } catch (e) { } if (part) d = d && d[part]; if (d != null && d !== '') ph = String(d); }
    el.placeholder = ph;
  });
  $$('#form [data-reset]').forEach(b => { b.closest('.f, label')?.closest('.f')?.classList.toggle('ov', !isEmptyVal(getp(S, b.dataset.reset))); });
}
function refreshCalc() { $$('#form [data-calc]').forEach(el => { el.innerHTML = calcVal(el.dataset.calc); }); }
function renderChecks() {
  const el = $('#checks'); if (!el) return;
  const cs = checks();
  el.innerHTML = cs.length ? `<div class="checks"><b>檢核提醒</b>${cs.map(c => `<div class="${c.lv}"><a href="#" data-page="${c.page}">${PAGES.find(p => p.id === c.page).t}</a>　${esc(c.t)}</div>`).join('')}</div>` : '<div class="checks okb">✓ 目前沒有需要確認的檢核項目</div>';
}
let pvTimer = null;
function renderPreview() {
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => {
    const id = S.ui.page;

function fitPreview() { const col = $('#prevcol'), box = $('#preview'); if (!col || !box) return; const w = col.clientWidth - 40; box.style.zoom = Math.min(1, w / 794).toFixed(3); }
window.addEventListener('resize', fitPreview);

/* 互動 */
function onInput(e) {
  const el = e.target; const p = el.dataset && el.dataset.p; if (!p) return;
  let val = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.part) { const o = { ...(getp(S, p) || {}) }; o[el.dataset.part] = val; setp(S, p, o); }
  else setp(S, p, val);
  save();
  if (el.dataset.rr) { renderPage(); return; }
  refreshLinked(); refreshCalc(); renderChecks(); renderPreview();
  if (p.startsWith('basic.org') || p.startsWith('basic.town') || p.startsWith('basic.county')) renderNav();
  clearTimeout(onInput.nt); onInput.nt = setTimeout(renderNav, 600);
}
function listOp(act, path, i) {
  const arr = getp(S, path) || []; i = +i;
  if (act === 'add') { arr.push({}); setp(S, path, arr); }
  if (act === 'del') arr.splice(i, 1);
  if (act === 'up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
  if (act === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
  save(); renderPage();
  if (act === 'add') { const rows = $$(`#form [data-p^="${path}.${arr.length - 1}."]`); if (rows[0]) rows[0].focus(); }
}
const CMDS = {
  fromElection() {
    const E = S.assembly.el;
    const dr = elResult(E.dirs, V('assembly.el.dirSeats'), V('assembly.el.dirAlt')), sr = elResult(E.sups, V('assembly.el.supSeats'), V('assembly.el.supAlt'));
    if (!dr.all.length && !sr.all.length) { toast('請先在「會員大會會議紀錄 › 選舉」輸入候選人與得票數', 'err'); return; }
    let add = 0, upd = 0;
    const put = (name, role, keep) => {
      const r = S.roster.find(x => x.name === name);
      if (r) { if (!(keep.includes(r.role))) { if (r.role !== role) upd++; r.role = role; } }
      else { S.roster.push({ role, name }); add++; }
    };
    dr.win.forEach(c => put(c.name, '理事', ['理事長', '常務理事', '理事']));
    dr.alt.forEach(c => put(c.name, '候補理事', ['候補理事']));
    sr.win.forEach(c => put(c.name, '監事', ['常務監事', '監事']));
    sr.alt.forEach(c => put(c.name, '候補監事', ['候補監事']));
    save(); renderPage(); toast(`一覽表已更新：新增 ${add} 人、變更職別 ${upd} 人。理事長、常務理監事請在一覽表調整。`);
  },
  candFromRoster() {
    const E = S.assembly.el;
    const mk = roles => names(roles).map(name => ({ name, votes: '' }));
    if (!E.dirs.length) E.dirs = mk([...DIR_ROLES, '候補理事']);
    if (!E.sups.length) E.sups = mk([...SUP_ROLES, '候補監事']);
    save(); renderPage(); toast('已帶入候選人（只補空白的名單），請輸入得票數');
  },
  async sample() {
    if (!(await ask('載入範例資料？目前填寫的內容會被範例取代。建議先「備份資料」。'))) return;
    S = sampleState(); save(); renderPage(); toast('已載入範例資料');
  },
  async clear() {
    if (!(await ask('清除全部填寫內容？此動作無法復原，建議先「備份資料」。'))) return;
    const page = S.ui.page; S = blankState(); S.ui.page = page; save(); renderPage(); toast('已清除');
  },
  async backup() {
    const name = `${orgShort()}_填報資料備份_${new Date().toISOString().slice(0, 10)}.json`;
    await saveFile(name, new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
  },
  restore() { $('#fileIn').click(); },
};
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const data = JSON.parse(await f.text()); if (!data || !data.basic) throw new Error('格式不符'); S = merge(blankState(), data); save(); renderPage(); toast('已還原資料：' + f.name); }
  catch (err) { toast('無法讀取這個檔案：' + err.message, 'err'); }
  e.target.value = '';
});

document.addEventListener('input', onInput);
document.addEventListener('change', e => { if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT') onInput(e); });
document.addEventListener('click', async e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.page) { e.preventDefault(); S.ui.page = t.dataset.page; save(); renderPage(); document.body.classList.remove('navopen'); return; }
  if (t.dataset.reset) { const v = getp(S, t.dataset.reset); setp(S, t.dataset.reset, (v && typeof v === 'object') ? {} : ''); save(); renderPage(); return; }
  if (t.dataset.act) { listOp(t.dataset.act, t.dataset.list, t.dataset.i); return; }
  if (t.dataset.fintab) { S.ui.finTab = t.dataset.fintab; save(); renderPage(); return; }
  if (t.dataset.cmd) { CMDS[t.dataset.cmd](); return; }
  if (t.dataset.dl) {
    const id = t.dataset.doc, doc = docFor(id === 'basic' ? 'all' : id);
    if (!doc.sheets.length) { toast('沒有選擇要輸出的報表', 'err'); return; }
    const pg = PAGES.find(p => p.id === id);
    const name = `${orgShort()}_${id === 'all' ? '全部表單' : id === 'finance' ? `${O(Y(), '')}年度財務報表` : pg.t}`;
    t.disabled = true; await exportDoc(doc, t.dataset.dl, name); t.disabled = false; return;
  }
  if (t.id === 'navToggle') document.body.classList.toggle('navopen');
  if (t.id === 'pvToggle') { document.body.classList.toggle('pvopen'); fitPreview(); }
});

/* 提示、忙碌、確認 */
function toast(msg, kind) {
  const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.classList.add('out'), 3800); setTimeout(() => el.remove(), 4300);
}
function showBusy(msg) {
  const el = $('#busy'); el.querySelector('span').textContent = msg; el.hidden = false;
  return { set: m => el.querySelector('span').textContent = m, done: () => el.hidden = true };
}
function ask(msg) {
  return new Promise(res => {
    const m = $('#modal'); m.querySelector('p').textContent = msg; m.hidden = false;
    const done = v => { m.hidden = true; ok.onclick = no.onclick = null; res(v); };
    const ok = m.querySelector('.ok'), no = m.querySelector('.no');
    ok.onclick = () => done(true); no.onclick = () => done(false);
  });
}

if (!['basic', ...PAGES.map(p => p.id)].includes(S.ui.page)) S.ui.page = 'basic';
renderPage();
dlNS();

</script>
</body>
