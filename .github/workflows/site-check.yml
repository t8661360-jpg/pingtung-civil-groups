# 屏東縣人民團體數位櫃檯：自動檢查
# GitHub Actions 排程最短間隔為 5 分鐘（無法設定 3 分鐘），且尖峰時段可能延遲。
# 公開儲存庫使用 GitHub 提供的執行環境不另收費；儲存庫 60 天沒有任何更新時，GitHub 會自動停用排程。
name: 櫃檯自動檢查
on:
  schedule:
    - cron: '*/3 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: site-check-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 回歸測試
        run: for t in test-*.cjs; do echo "== $t"; node "$t" || exit 1; done
      - name: 快取瀏覽器
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.56.0-ubuntu-24.04
      - name: 安裝檢查工具
        if: github.event_name != 'push'
        run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: 公開網站檢查
        if: github.event_name != 'push'
        env:
          BASE_URL: https://t8661360-jpg.github.io/pingtung-civil-groups/
        run: node scripts/site-smoke.mjs
      - name: 失敗時開立或更新問題單
        if: failure() && github.event_name != 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({owner, repo, state: 'open', labels: 'site-check'});
            if (open.data.length) {
              await github.rest.issues.createComment({owner, repo, issue_number: open.data[0].number, body: `仍然失敗：${url}`});
            } else {
              await github.rest.issues.create({owner, repo, title: '自動檢查失敗：屏東縣人民團體數位櫃檯', labels: ['site-check'], body: `自動檢查發現問題，請查看執行紀錄：${url}`});
            }
