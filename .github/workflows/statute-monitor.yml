name: 📜 每週法規監測

on:
  schedule:
    - cron: '0 18 * * 0'   # 週日 18:00 UTC = 台灣週一 02:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 比對 data/statutes.json.gz 內全部法規（69 部）與法務部開放資料
      # 來源：kong0107/mojLawSplitJSON（每日自全國法規資料庫整包拆分，一部一檔）
      # 結束碼 0 無異動 / 1 有異動 / 2 抓取全部失敗
      - name: 比對法規
        id: cmp
        run: |
          set +e
          node scripts/statute-monitor.cjs --out STATUTE_CHANGES.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat STATUTE_CHANGES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statute-monitor-${{ github.run_number }}
          path: STATUTE_CHANGES.md
          retention-days: 90

      - name: 有異動時開 Issue
        if: steps.cmp.outputs.code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('STATUTE_CHANGES.md', 'utf8');
            const title = '📜 法規異動：' + new Date().toISOString().slice(0, 10);
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: '法規監測' });
            if (open.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body: '### 本週重跑\n' + body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['法規監測'] });
            }

      - name: 抓取失敗時開 Issue
        if: steps.cmp.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: '⚠️ 法規監測抓取失敗 ' + new Date().toISOString().slice(0, 10),
              body: '無法取得任何法規資料，請檢查 raw.githubusercontent.com / kong0107/mojLawSplitJSON 是否可用。\n\n' + require('fs').readFileSync('STATUTE_CHANGES.md','utf8'),
              labels: ['法規監測'] });
